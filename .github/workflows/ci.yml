name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r backend/requirements-dev.txt
      - name: Lint
        run: ruff check backend simulator --config backend/pyproject.toml
      - name: Backend tests
        working-directory: backend
        run: pytest -q
      - name: Simulator tests
        working-directory: simulator
        run: pytest -q test_sensors.py

  e2e:
    # Starts the real stack (Mosquitto + backend + simulator) and checks that
    # readings make it all the way from the simulator to the API.
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Start stack
        run: docker compose up -d --build --wait mosquitto backend && docker compose up -d simulator
      - name: Smoke test
        run: python3 scripts/smoke_test.py --url http://localhost:8000 --sensors 8 --timeout 120
      - name: Logs
        if: always()
        run: docker compose logs --tail 80
      - name: Stop stack
        if: always()
        run: docker compose down -v
