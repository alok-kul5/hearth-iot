<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Home Sensors</title>
  <link rel="stylesheet" href="/static/style.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js" defer></script>
  <script src="/static/app.js" defer></script>
</head>
<body>
  <header class="top">
    <div>
      <h1>Home Sensors</h1>
      <p class="sub">Live readings over MQTT</p>
    </div>
    <div class="status" id="status"><span class="dot"></span><span id="status-text">Connecting…</span></div>
  </header>

  <main>
    <section aria-labelledby="alerts-h" class="panel alerts-panel">
      <div class="panel-head">
        <h2 id="alerts-h">Active alerts</h2>
        <span class="count" id="alert-count">0</span>
      </div>
      <ul id="alerts" class="alerts"><li class="empty">No active alerts</li></ul>
    </section>

    <section aria-labelledby="sensors-h">
      <h2 id="sensors-h" class="section-title">Sensors</h2>
      <div id="sensors" class="grid"></div>
    </section>

    <section aria-labelledby="chart-h" class="panel">
      <div class="panel-head">
        <h2 id="chart-h">History: <span id="chart-title">pick a sensor</span></h2>
        <div class="ranges" role="group" aria-label="Time range">
          <button data-min="5">5m</button>
          <button data-min="15" class="on">15m</button>
          <button data-min="60">1h</button>
          <button data-min="360">6h</button>
        </div>
      </div>
      <div class="chart-wrap"><canvas id="chart"></canvas></div>
    </section>

    <section aria-labelledby="log-h" class="panel">
      <div class="panel-head"><h2 id="log-h">Alert log</h2></div>
      <table class="log">
        <thead><tr><th>Opened</th><th>Sensor</th><th>Alert</th><th>Status</th></tr></thead>
        <tbody id="log"></tbody>
      </table>
    </section>
  </main>
</body>
</html>
